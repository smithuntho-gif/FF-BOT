name: Red news 15 min reminder

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright==1.47.0 requests
          python -m playwright install --with-deps chromium
      - name: Post reminder if news is due
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ff_remind.py
      - name: Save what was posted
        run: |
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git config user.name "ff-bot"
            git config user.email "ff-bot@users.noreply.github.com"
            git add sent.json
            git commit -m "reminder posted"
            git push
          fi
